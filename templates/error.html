<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi Tải Video</title>
    <style>
        body {
            background: #0d0f15;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            max-width: 420px;
        }
        h3 { color: #f87171; margin-bottom: 12px; font-size: 18px; }
        p { color: #9ca3af; font-size: 14px; margin-bottom: 22px; line-height: 1.5; }
        a.btn {
            display: inline-block;
            background: #6366f1;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>❌ {{ message or "Không thể phát video này" }}</h3>
        <p>Liên kết có thể ở chế độ riêng tư, đã bị chủ sở hữu xóa hoặc nền tảng giới hạn quyền truy cập.</p>
        {% if original_url and original_url != '#' %}
        <a href="{{ original_url }}" target="_blank" class="btn">Mở bài viết gốc ↗</a>
        {% endif %}
    </div>
</body>
</html>
