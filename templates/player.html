<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ "Xem Ảnh TikTok" if media_type == "images" else "Đang phát Video" }}</title>
    <!-- Cache buster query string v=2 để không bị cache css cũ -->
    <link rel="stylesheet" href="/static/css/player.css?v=2">
</head>
<body>
    <div class="player-container">
        <!-- Action Bar góc trên -->
        <div class="action-bar">
            {% if media_type == "video" %}
            <a href="{{ video_url }}" download="video.mp4" class="btn-action" title="Tải video">
                ⬇ Tải MP4
            </a>
            {% elif media_type == "images" %}
            <a id="downloadImgBtn" href="{{ images[0] }}" target="_blank" download class="btn-action" title="Tải ảnh">
                ⬇ Tải Ảnh Này
            </a>
            {% endif %}
            <a href="{{ original_url }}" target="_blank" rel="noopener noreferrer" class="btn-action" title="Xem bài gốc">
                🔗 Nguồn
            </a>
        </div>

        {% if media_type == "video" %}
        <!-- Trình phát Video MP4 -->
        <video id="mainVideo" controls autoplay playsinline loop muted>
            <source src="{{ video_url }}" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ video HTML5.
        </video>
        <script>
            const video = document.getElementById('mainVideo');
            video.play().then(() => {
                video.muted = false;
            }).catch(() => {
                document.body.addEventListener('click', () => {
                    video.muted = false;
                    video.play();
                }, { once: true });
            });
        </script>

        {% elif media_type == "images" %}
        <!-- Trình lướt ảnh TikTok (Slideshow + Nhạc nền) -->
        <div class="gallery-container">
            <button type="button" class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
            <img id="activeSlide" class="slide-img" src="{{ images[0] }}" alt="TikTok Photo">
            <button type="button" class="nav-btn next-btn" id="nextBtn">&#10095;</button>
            <div id="slideIndicator" class="indicator">1 / {{ images|length }}</div>
        </div>

        {% if music_url %}
        <!-- Nhạc nền kèm theo slideshow TikTok -->
        <audio id="bgMusic" autoplay loop>
            <source src="{{ music_url }}" type="audio/mp4">
        </audio>
        {% endif %}

        <script>
            const images = {{ images | tojson }};
            let currentIndex = 0;
            const imgElem = document.getElementById('activeSlide');
            const indElem = document.getElementById('slideIndicator');
            const dlBtn = document.getElementById('downloadImgBtn');
            const bgMusic = document.getElementById('bgMusic');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            function updateSlide() {
                imgElem.style.opacity = '0.2';
                const nextSrc = images[currentIndex];
                
                // Preload ảnh tiếp theo để chuyển mượt không bị nháy
                const tempImg = new Image();
                tempImg.onload = () => {
                    imgElem.src = nextSrc;
                    indElem.textContent = `${currentIndex + 1} / ${images.length}`;
                    if (dlBtn) dlBtn.href = nextSrc;
                    imgElem.style.opacity = '1';
                };
                tempImg.src = nextSrc;
            }

            function nextSlide() {
                currentIndex = (currentIndex + 1) % images.length;
                updateSlide();
            }

            function prevSlide() {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                updateSlide();
            }

            // Gắn sự kiện click nút bấm
            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                nextSlide();
            });

            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                prevSlide();
            });

            // Bấm vào nửa phải màn hình -> Next, nửa trái -> Prev
            imgElem.addEventListener('click', (e) => {
                const rect = imgElem.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                if (clickX > rect.width / 2) {
                    nextSlide();
                } else {
                    prevSlide();
                }
            });

            // Hỗ trợ phím mũi tên bàn phím
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
            });

            // Vuốt cảm ứng điện thoại (Swipe Touch)
            let touchStartX = 0;
            let touchStartY = 0;

            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].clientX;
                touchStartY = e.changedTouches[0].clientY;
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const diffX = touchStartX - touchEndX;
                const diffY = touchStartY - touchEndY;

                // Nếu là vuốt ngang (tránh nhầm với cuộn dọc)
                if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) nextSlide();
                    else prevSlide();
                }
            }, { passive: true });

            // Bật nhạc nền
            if (bgMusic) {
                bgMusic.play().catch(() => {
                    document.body.addEventListener('click', () => {
                        bgMusic.play();
                    }, { once: true });
                });
            }
        </script>
        {% endif %}
    </div>
</body>
</html>
