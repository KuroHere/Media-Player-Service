<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ "Xem Ảnh TikTok" if media_type == "images" else "Đang phát Video" }}</title>
    <!-- Cache buster query string v=3 -->
    <link rel="stylesheet" href="/static/css/player.css?v=3">
</head>
<body>
    <div class="player-container">
        <!-- Action Bar góc trên -->
        <div class="action-bar">
            {% if media_type == "video" %}
            <a href="{{ video_url }}" download="video.mp4" class="btn-action" title="Tải video">
                ⬇ Tải MP4
            </a>
            {% elif media_type == "images" %}
            <a id="downloadImgBtn" href="{{ images[0] }}" target="_blank" download class="btn-action" title="Tải ảnh">
                ⬇ Tải Ảnh Này
            </a>
            {% endif %}
            <a href="{{ original_url }}" target="_blank" rel="noopener noreferrer" class="btn-action" title="Xem bài gốc">
                🔗 Nguồn
            </a>
        </div>

        {% if media_type == "video" %}
        <!-- Trình phát Video MP4 -->
        <video id="mainVideo" controls autoplay playsinline loop muted>
            <source src="{{ video_url }}" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ video HTML5.
        </video>
        <script>
            const video = document.getElementById('mainVideo');
            video.play().then(() => {
                video.muted = false;
            }).catch(() => {
                document.body.addEventListener('click', () => {
                    video.muted = false;
                    video.play();
                }, { once: true });
            });
        </script>

        {% elif media_type == "images" %}
        <!-- Trình lướt ảnh TikTok (Slideshow) -->
        <div class="gallery-container">
            <button type="button" class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
            <img id="activeSlide" class="slide-img" src="{{ images[0] }}" alt="TikTok Photo">
            <button type="button" class="nav-btn next-btn" id="nextBtn">&#10095;</button>

            <!-- Bottom Deck: Bộ đếm số ảnh + Trình điều khiển Âm thanh -->
            <div class="bottom-deck">
                <div id="slideIndicator" class="indicator">1 / {{ images|length }}</div>

                {% if music_url %}
                <div class="audio-control-bar" id="audioBar">
                    <button type="button" class="audio-btn" id="playPauseBtn" title="Phát / Tạm dừng">⏸</button>
                    <button type="button" class="audio-btn" id="muteBtn" title="Tắt / Bật tiếng">🔊</button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" title="Chỉnh âm lượng">
                </div>
                {% endif %}
            </div>
        </div>

        {% if music_url %}
        <!-- Thẻ âm thanh chạy ngầm độc lập -->
        <audio id="bgMusic" autoplay loop>
            <source src="{{ music_url }}" type="audio/mp4">
        </audio>
        {% endif %}

        <script>
            const images = {{ images | tojson }};
            let currentIndex = 0;
            const imgElem = document.getElementById('activeSlide');
            const indElem = document.getElementById('slideIndicator');
            const dlBtn = document.getElementById('downloadImgBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            function updateSlide() {
                imgElem.style.opacity = '0.2';
                const nextSrc = images[currentIndex];
                
                const tempImg = new Image();
                tempImg.onload = () => {
                    imgElem.src = nextSrc;
                    indElem.textContent = `${currentIndex + 1} / ${images.length}`;
                    if (dlBtn) dlBtn.href = nextSrc;
                    imgElem.style.opacity = '1';
                };
                tempImg.src = nextSrc;
            }

            function nextSlide() {
                currentIndex = (currentIndex + 1) % images.length;
                updateSlide();
            }

            function prevSlide() {
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                updateSlide();
            }

            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                nextSlide();
            });

            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                prevSlide();
            });

            // Bấm nửa phải ảnh -> Next, nửa trái -> Prev
            imgElem.addEventListener('click', (e) => {
                const rect = imgElem.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                if (clickX > rect.width / 2) {
                    nextSlide();
                } else {
                    prevSlide();
                }
            });

            // Phím mũi tên
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
            });

            // Vuốt cảm ứng điện thoại
            let touchStartX = 0;
            let touchStartY = 0;

            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].clientX;
                touchStartY = e.changedTouches[0].clientY;
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const diffX = touchStartX - touchEndX;
                const diffY = touchStartY - touchEndY;

                if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0) nextSlide();
                    else prevSlide();
                }
            }, { passive: true });

            // ----------------- ĐIỀU KHIỂN AUDIO RIÊNG BIỆT -----------------
            const bgMusic = document.getElementById('bgMusic');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const muteBtn = document.getElementById('muteBtn');
            const volumeSlider = document.getElementById('volumeSlider');

            if (bgMusic) {
                // Tự động phát khi tải
                bgMusic.play().catch(() => {
                    document.body.addEventListener('click', () => {
                        bgMusic.play();
                    }, { once: true });
                });

                // Nút Phát / Tạm dừng
                if (playPauseBtn) {
                    playPauseBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (bgMusic.paused) {
                            bgMusic.play();
                            playPauseBtn.textContent = '⏸';
                        } else {
                            bgMusic.pause();
                            playPauseBtn.textContent = '▶';
                        }
                    });
                }

                // Nút Tắt / Bật tiếng
                if (muteBtn) {
                    muteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        bgMusic.muted = !bgMusic.muted;
                        muteBtn.textContent = bgMusic.muted ? '🔇' : '🔊';
                    });
                }

                // Thanh trượt chỉnh âm lượng (0% -> 100%)
                if (volumeSlider) {
                    volumeSlider.addEventListener('input', (e) => {
                        e.stopPropagation();
                        bgMusic.volume = parseFloat(e.target.value);
                        if (bgMusic.volume === 0) {
                            muteBtn.textContent = '🔇';
                        } else {
                            bgMusic.muted = false;
                            muteBtn.textContent = '🔊';
                        }
                    });

                    // Ngăn chặn sự kiện click lan ra ngoài gây chuyển ảnh
                    volumeSlider.addEventListener('click', (e) => e.stopPropagation());
                    volumeSlider.addEventListener('touchstart', (e) => e.stopPropagation());
                }
            }
        </script>
        {% endif %}
    </div>
</body>
</html>
